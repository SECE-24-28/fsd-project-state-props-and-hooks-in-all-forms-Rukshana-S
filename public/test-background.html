<!DOCTYPE html>
<html>
<head>
    <title>Test Background Image</title>
    <style>
        body {
            background-image: url('/images/admin_background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .overlay {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(6px);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Background Image Test</h1>
        <p>If you can see this with a blurred background image, the admin_background.png is loading correctly!</p>
        <p>Path: /images/admin_background.png</p>
    </div>
</body>
</html>
